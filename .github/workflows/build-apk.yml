name: Build Flutter APK

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Defines the jobs to be run
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed
    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      # 2. Sets up Java (required for Android build tools)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Sets up the Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Installs your project's dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. The magic command: Builds the release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 6. Saves the generated APK as an artifact you can download
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
